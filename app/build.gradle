plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aee.mokacam'
    compileSdk 34

    defaultConfig {
        applicationId "com.aee.mokacam"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "1.09"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // Ported third-party libraries of the original app
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'
    // RTSP live view (replaces the original closed-source libAeePlayer.so)
    // and local video playback (replaces Vitamio).
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
}
